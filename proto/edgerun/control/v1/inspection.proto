// Control seam, read-only observability. Server: orchestrator.
// Clients: admin UI, CLI.
syntax = "proto3";

package edgerun.control.v1;

import "edgerun/common/v1/common.proto";
import "edgerun/control/v1/model.proto";

service InspectionService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  // ListInvocations pages through invocation records, newest first.
  rpc ListInvocations(ListInvocationsRequest) returns (ListInvocationsResponse);
  // GetInvocation returns one invocation record by its id: NOT_FOUND if there
  // is none (yet: records are written shortly after a call ends, and removed
  // after the retention period).
  rpc GetInvocation(GetInvocationRequest) returns (GetInvocationResponse);
  // ListNetworkServices returns the network services that have registered.
  rpc ListNetworkServices(ListNetworkServicesRequest) returns (ListNetworkServicesResponse);
}

message DescribeRequest {}

message DescribeResponse {
  edgerun.common.v1.Implementation implementation = 1;
  // Upper bound for CreateVersionRequest.module.
  uint64 max_module_bytes = 2;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerStatus workers = 1;
}

message ListNetworkServicesRequest {}

message ListNetworkServicesResponse {
  repeated NetworkServiceStatus services = 1;
}

message ListInvocationsRequest {
  // Restrict to one function; empty for all.
  string function_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
  // Restrict to the invocations of one request id (the X-Request-Id the
  // frontend answered with; unique only as far as the caller makes it so);
  // empty for all. Combined with function_id, both must hold.
  string request_id = 4;
}

message GetInvocationRequest {
  // The id a response carries (X-Edgerun-Invocation-Id; InvokeHead.invocation_id)
  // or an Invoke error does (ErrorInfo.invocation_id).
  string invocation_id = 1;
}

message GetInvocationResponse {
  Invocation invocation = 1;
}

message ListInvocationsResponse {
  repeated Invocation invocations = 1;
  string next_page_token = 2;
}
